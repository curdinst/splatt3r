# pretrained_mast3r_path: './checkpoints/25-08-29-02-41-17_epoch=10_step=22473.ckpt'
# pretrained_mast3r_path: './checkpoints/splatt3r_no_coarseness.ckpt'

# pretrained_mast3r_path: './checkpoints/keep/splatt3r_3stage_freq_pred.ckpt'

# pretrained_mast3r_path: './checkpoints/keep/splatt3r_coarse=0_epoch=04.ckpt'
checkpoint_file_path: '/mnt/buzz_newhd/home/v4rl/splatt3r/checkpoints'

grad_gaussian_dpt: True
grad_gaussian_256_dpt: True
grad_gaussian_128_dpt: True

grad_coarseness_prediction: False

coarseness_predictions: True
grad_coarseness: False

train_coarseness_prediction: False
train_coarseness_prediction_img_grad: False

train_3stage_gaussian_heads: False

train_on_single_prediction: False

mse_penalty_512: 0.1372257272161434 #0.05
mse_penalty_256: 0.02836572834904122 #0.025
penalty_optimisation: False

use_lod: False
th_rgb: [0.1, 0.3]
th_depth: [0.2, 0.5]
resolution: 512
train_head_only: False
use_calib_and_gt_depth: True

# Data
data:
  root: '/mnt/buzz_newhd/home/v4rl/scannetpp-dataset/'
  batch_size: 1
  num_workers: 4
  resolution: [512, 512]
  epochs_per_train_epoch: 12 #12 #50 #10 #100 # How many times to sample from each scene each training epoch (helps avoid unnecessary Pytorch Lightning overhead)

# Optimization
opt:
  epochs: 20 #5 # 20
  lr: 1e-5 # 0.000005 # 0.00001
  weight_decay: 0.05
  gradient_clip_val: 0.5

loss:
  mse_loss_weight: 1.0
  lpips_loss_weight: 0.25
  mast3r_loss_weight: Null
  apply_mask: True
  average_over_mask: True
  mast3r_confidence_threshold: 1.5

use_offsets: False
sh_degree: 1
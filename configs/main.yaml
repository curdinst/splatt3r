name: '%Y-%m-%d-%H-%M-%S'

save_dir: './results/${name}/'

# Environment
seed: 0
devices: [0]

# Loggers
use_profiler: False
loggers:
  use_csv_logger: True
  use_wandb: True

# Model
use_pretrained: True
pretrained_mast3r_path: './pretrained/epoch=19-step=1200.ckpt'

# Data
data:
  root: '/mnt/buzz_newhd/home/v4rl/scannetpp-dataset/'
  batch_size: 1
  num_workers: 1
  resolution: [512, 512]
  epochs_per_train_epoch: 100 # How many times to sample from each scene each training epoch (helps avoid unnecessary Pytorch Lightning overhead)

# Optimization
opt:
  epochs: 20
  lr: 0.00001
  weight_decay: 0.05
  gradient_clip_val: 0.5

loss:
  mse_loss_weight: 1.0
  lpips_loss_weight: 0.25
  mast3r_loss_weight: Null
  apply_mask: True
  average_over_mask: True

use_offsets: False
sh_degree: 1
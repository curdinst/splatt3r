name: '%Y-%m-%d-%H-%M-%S_Test'

save_dir: './results/${name}/'

# Environment
seed: 0
devices: [0]

# Loggers
use_profiler: False
loggers:
  use_csv_logger: True
  use_wandb: False

# Model
use_pretrained: True
# pretrained_mast3r_path: './checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth'
# pretrained_mast3r_path: './pretrained/splatt3r_3stage.ckpt'
pretrained_mast3r_path: './checkpoints/splatt3r_3stage_1ep.ckpt'

# pretrained_mast3r_path: './pretrained/splatt3r_coarse.ckpt'
# pretrained_mast3r_path: './checkpoints/keep/splatt3r_coarse=0_epoch=02_batch1_v2.ckpt'
# pretrained_mast3r_path: './checkpoints/keep/splatt3r_coarse=0_epoch=07_head_only.ckpt'
# pretrained_mast3r_path: './checkpoints/keep/splatt3r_coarse=0_epoch=07_head_only.ckpt'

grad_gaussian_dpt: False
grad_gaussian_256_dpt: False
grad_gaussian_128_dpt: False
grad_coarseness_prediction: False
coarseness_predictions: False
train_coarseness_prediction: False
train_coarseness_prediction_img_grad: False
use_lod: False
th_rgb: 0.3
th_depth: 0.5
resolution: 512
train_head_only: False
use_calib: True

# Data
data:
  root: '/mnt/buzz_newhd/home/v4rl/scannetpp-dataset/'
  batch_size: 1
  num_workers: 4
  resolution: [512, 512]
  epochs_per_train_epoch: 12 #12 #50 #10 #100 # How many times to sample from each scene each training epoch (helps avoid unnecessary Pytorch Lightning overhead)

# Optimization
# opt:
#   epochs: 10 #5 # 20
#   lr: 0.00001
#   weight_decay: 0.05
#   gradient_clip_val: 0.5

loss:
  mse_loss_weight: 1.0
  lpips_loss_weight: 0.25
  mast3r_loss_weight: Null
  apply_mask: True
  average_over_mask: True

use_offsets: False
sh_degree: 1